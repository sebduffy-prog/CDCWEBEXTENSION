<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chef de Commis</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 440px;
      min-height: 560px;
      background-color: #f7d74a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #1A1A1A;
      font-size: 13px;
      padding: 16px;
      overflow-y: auto;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1A1A1A; border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    /* ── Header ─────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 900;
      color: #1A1A1A;
      letter-spacing: -0.5px;
    }
    .header .version {
      font-size: 11px;
      font-family: 'Courier New', monospace;
      color: #5a4e00;
      font-weight: 600;
    }

    /* ── Section Labels ─────────────────────── */
    .section-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #5a4e00;
      margin-bottom: 8px;
    }

    /* ── Dark Card Containers ───────────────── */
    .card {
      background-color: #1A1A1A;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h3 {
      font-size: 12px;
      font-weight: 700;
      color: #FFD700;
      margin-bottom: 10px;
    }
    .card label {
      color: #ccc;
      font-size: 12px;
      white-space: nowrap;
    }

    /* ── Inputs ─────────────────────────────── */
    input[type="text"],
    input[type="number"] {
      background-color: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      font-size: 12px;
      border-radius: 8px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: #FFD700;
    }
    input[type="text"] {
      flex: 1;
    }
    input[type="number"] {
      width: 70px;
    }

    /* ── Buttons ────────────────────────────── */
    .btn-gold {
      background-color: #f7d74a;
      color: #1A1A1A;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }
    .btn-gold:hover {
      background-color: #e5c63e;
      transform: translateY(-1px);
    }
    .btn-gold:active { transform: translateY(0); }

    .btn-outline {
      background: transparent;
      border: 2px solid #FFD700;
      color: #FFD700;
      font-weight: 700;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-outline:hover {
      background-color: #FFD700;
      color: #1A1A1A;
    }

    .btn-danger {
      background-color: #3a1111;
      color: #ff8888;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.15s;
    }
    .btn-danger:hover { background-color: #4a1a1a; }

    /* ── Flex Helpers ───────────────────────── */
    .flex { display: flex; }
    .flex-1 { flex: 1; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 10px; }
    .items-center { align-items: center; }
    .w-full { width: 100%; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .mt-3 { margin-top: 12px; }

    /* ── Column Rows ────────────────────────── */
    .columns-scroll {
      max-height: 170px;
      overflow-y: auto;
    }
    .column-row {
      background-color: #2a2a2a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .column-row .col-name {
      font-weight: 700;
      color: #FFD700;
      font-family: 'Courier New', monospace;
      flex-shrink: 0;
      max-width: 100px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .column-row .col-selector {
      color: #666;
      font-size: 10px;
      font-family: 'Courier New', monospace;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }
    .column-row .col-count {
      color: #FFD700;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      font-weight: 600;
      flex-shrink: 0;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-mapped { background-color: #22c55e; }
    .status-unmapped { background-color: #ef4444; }

    .btn-sm {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      font-weight: 700;
    }
    .btn-select-col {
      background-color: #f7d74a;
      color: #1A1A1A;
    }
    .btn-select-col:hover { background-color: #e5c63e; }
    .btn-remove-col {
      background-color: #333;
      color: #888;
    }
    .btn-remove-col:hover { background-color: #444; color: #ccc; }

    /* ── Divider ────────────────────────────── */
    .divider {
      border: none;
      border-top: 2px solid #d4b83d;
      margin: 14px 0;
      opacity: 0.4;
    }

    /* ── Textarea ───────────────────────────── */
    textarea {
      width: 100%;
      height: 160px;
      background-color: #2a2a2a;
      color: #FFD700;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      outline: none;
      resize: vertical;
    }
    textarea:focus { border-color: #FFD700; }
    textarea::placeholder { color: #555; }

    /* ── Next Button Status ─────────────────── */
    .status-text { font-size: 11px; font-style: italic; }
    .status-set { color: #22c55e; }
    .status-unset { color: #888; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>Chef de Commis</h1>
    <span class="version">v5.1.0</span>
  </div>

  <!-- Step 1: Map chosen fields -->
  <section class="mb-3">
    <div class="section-label">Step 1 &mdash; Map chosen fields</div>
    <div class="card">
      <div class="flex gap-2 mb-3">
        <input
          id="new-column-name"
          type="text"
          placeholder="e.g. Author, Title, Date..."
        />
        <button id="btn-add-column" class="btn-gold">+ Add Column</button>
      </div>
      <div id="columns-container" class="columns-scroll"></div>
    </div>
  </section>

  <hr class="divider">

  <!-- Step 2: Scrape Mode -->
  <section class="mb-3">
    <div class="section-label">Step 2 &mdash; Scrape Mode</div>

    <!-- Card A: Target Extraction -->
    <div class="card mb-3">
      <h3>A &bull; Target Extraction (Auto-Scroll)</h3>
      <div class="flex gap-2 items-center">
        <label>Extract</label>
        <input
          id="target-count"
          type="number"
          min="1"
          value="20"
        />
        <label>Items</label>
        <button id="btn-auto-scroll" class="btn-outline flex-1">Start Extraction</button>
      </div>
    </div>

    <!-- Card B: Pagination -->
    <div class="card">
      <h3>B &bull; Pagination</h3>
      <div class="flex gap-2 items-center mb-2">
        <button id="btn-select-next" class="btn-outline flex-1">Select "Next Page" Button</button>
        <span id="next-btn-status" class="status-text status-unset">Not set</span>
      </div>
      <div class="flex gap-2 items-center">
        <label>Pages:</label>
        <input
          id="page-count"
          type="number"
          min="1"
          value="3"
        />
        <button id="btn-auto-paginate" class="btn-outline flex-1">Start Auto-Pagination</button>
      </div>
    </div>
  </section>

  <hr class="divider">

  <!-- Step 3: Reformat for export -->
  <section class="mb-3">
    <div class="section-label">Step 3 &mdash; Reformat for export</div>
    <div class="card">
      <button id="btn-format" class="btn-gold w-full" style="padding: 10px; font-size: 13px;">Format &amp; Prepare Data</button>
      <textarea
        id="output-preview"
        placeholder="Formatted output will appear here..."
      ></textarea>
    </div>
  </section>

  <!-- Export -->
  <section class="flex gap-2">
    <button id="btn-download" class="btn-gold flex-1">Download UTF-8 .txt</button>
    <button id="btn-clear" class="btn-danger flex-1">Clear All Storage</button>
  </section>

  <script src="popup.js"></script>
</body>
</html>
